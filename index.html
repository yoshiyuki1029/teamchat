<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TeamChat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI','Hiragino Sans','Yu Gothic UI',sans-serif; background: #0f1117; color: #e8eaf0; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }

/* AUTH */
#auth-screen { display: flex; align-items: center; justify-content: center; height: 100dvh; background: radial-gradient(ellipse at 60% 30%, #1a2060 0%, #0f1117 70%); }
.auth-card { background: #171b26; border: 1px solid #2a3050; border-radius: 16px; padding: 36px; width: 340px; }
.auth-logo { font-size: 24px; font-weight: 800; color: #5b8af0; margin-bottom: 4px; }
.auth-sub { font-size: 12px; color: #8b93b0; margin-bottom: 24px; }
.auth-tabs { display: flex; gap: 4px; background: #1e2435; border-radius: 8px; padding: 4px; margin-bottom: 20px; }
.auth-tab { flex: 1; padding: 7px; border: none; background: none; color: #8b93b0; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
.auth-tab.active { background: #5b8af0; color: #fff; }
.auth-card input { width: 100%; padding: 10px 12px; margin-bottom: 12px; background: #1e2435; border: 1px solid #2a3050; border-radius: 8px; color: #e8eaf0; font-size: 14px; outline: none; }
.auth-card input:focus { border-color: #5b8af0; }
.auth-card .btn-primary { width: 100%; padding: 11px; background: #5b8af0; border: none; border-radius: 8px; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; }
.auth-card .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.auth-err { color: #e05a5a; font-size: 12px; margin-top: 8px; text-align: center; min-height: 16px; }
.auth-ok { color: #4caf88; font-size: 12px; margin-top: 8px; text-align: center; min-height: 16px; }

/* APP */
#app { display: none; flex: 1; overflow: hidden; }
#app.visible { display: flex; }

/* SIDEBAR */
.sidebar { width: 230px; background: #171b26; border-right: 1px solid #2a3050; display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar-header { padding: 14px 16px; border-bottom: 1px solid #2a3050; display: flex; align-items: center; justify-content: space-between; }
.sidebar-logo { font-size: 15px; font-weight: 800; color: #5b8af0; }
.icon-btn { background: none; border: none; color: #8b93b0; cursor: pointer; font-size: 16px; padding: 4px 7px; border-radius: 4px; line-height: 1; }
.icon-btn:hover { background: #1e2435; color: #e8eaf0; }
.icon-btn.hidden { display: none; }
.sidebar-section { padding: 8px; }
.section-label { font-size: 11px; color: #8b93b0; font-weight: 700; letter-spacing: 1px; padding: 8px 8px 4px; text-transform: uppercase; display: flex; align-items: center; justify-content: space-between; }
.room-item { display: flex; align-items: center; gap: 6px; padding: 7px 10px; border-radius: 8px; cursor: pointer; color: #8b93b0; font-size: 14px; transition: all 0.15s; margin-bottom: 2px; position: relative; user-select: none; }
.room-item:hover { background: #1e2435; color: #e8eaf0; }
.room-item.active { background: #5b8af0; color: #fff; }
.room-item .badge { margin-left: auto; background: #e05a5a; color: #fff; font-size: 10px; font-weight: 700; min-width: 18px; height: 18px; border-radius: 9px; display: flex; align-items: center; justify-content: center; padding: 0 4px; }
.sidebar-scroll { flex: 1; overflow-y: auto; }
.sidebar-scroll::-webkit-scrollbar { width: 4px; }
.sidebar-scroll::-webkit-scrollbar-thumb { background: #2a3050; border-radius: 2px; }
.sidebar-footer { padding: 12px 16px; border-top: 1px solid #2a3050; display: flex; align-items: center; gap: 8px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0; }
.avatar.online::after { content:''; position:absolute; width:9px; height:9px; background:#4caf88; border-radius:50%; bottom:0; right:0; border:2px solid #171b26; }
.avatar-wrap { position: relative; display: inline-flex; }
.user-name { font-size: 13px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.online-dot { width: 8px; height: 8px; border-radius: 50%; background: #4caf88; flex-shrink: 0; }
.offline-dot { width: 8px; height: 8px; border-radius: 50%; background: #8b93b0; flex-shrink: 0; }

/* MAIN */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.main-header { padding: 0 20px; height: 52px; border-bottom: 1px solid #2a3050; display: flex; align-items: center; background: #171b26; flex-shrink: 0; gap: 10px; }
.channel-title { font-size: 15px; font-weight: 700; flex: 1; }
.channel-desc { font-size: 12px; color: #8b93b0; }
.header-btn { background: none; border: none; color: #8b93b0; cursor: pointer; padding: 6px 8px; border-radius: 6px; font-size: 14px; }
.header-btn:hover { background: #1e2435; color: #e8eaf0; }

/* SEARCH BAR */
.search-bar { padding: 10px 20px; border-bottom: 1px solid #2a3050; background: #171b26; display: none; }
.search-bar.open { display: block; }
.search-input { width: 100%; padding: 8px 12px; background: #1e2435; border: 1px solid #2a3050; border-radius: 8px; color: #e8eaf0; font-size: 13px; outline: none; }
.search-input:focus { border-color: #5b8af0; }
.search-results { margin-top: 8px; max-height: 200px; overflow-y: auto; }
.search-result-item { padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.search-result-item:hover { background: #1e2435; }
.search-result-name { font-weight: 600; font-size: 12px; color: #8b93b0; margin-bottom: 2px; }

/* MESSAGES */
.messages-wrap { flex: 1; overflow-y: auto; padding: 16px 20px; }
.messages-wrap::-webkit-scrollbar { width: 6px; }
.messages-wrap::-webkit-scrollbar-thumb { background: #2a3050; border-radius: 3px; }
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #8b93b0; gap: 8px; }
.empty-icon { font-size: 40px; }
.day-sep { text-align: center; margin: 12px 0; position: relative; }
.day-sep span { background: #0f1117; padding: 0 12px; font-size: 11px; color: #8b93b0; position: relative; z-index: 1; }
.day-sep::before { content:''; position:absolute; top:50%; left:0; right:0; height:1px; background:#2a3050; }
.msg { display: flex; gap: 10px; margin-bottom: 2px; padding: 3px 8px; border-radius: 8px; position: relative; }
.msg:hover { background: #1e2435; }
.msg:hover .msg-actions { display: flex; }
.msg.first-in-group { margin-top: 12px; }
.msg-avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; margin-top: 2px; }
.msg-spacer { width: 34px; flex-shrink: 0; }
.msg-body { flex: 1; min-width: 0; }
.msg-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
.msg-author { font-size: 14px; font-weight: 700; cursor: pointer; }
.msg-author:hover { text-decoration: underline; }
.msg-time { font-size: 11px; color: #8b93b0; }
.msg-text { font-size: 14px; line-height: 1.55; word-break: break-word; white-space: pre-wrap; }
.msg-img { max-width: 300px; max-height: 220px; border-radius: 8px; margin-top: 6px; cursor: pointer; object-fit: cover; border: 1px solid #2a3050; display: block; }
.template-bubble { display: inline-block; padding: 7px 14px; border-radius: 16px; font-size: 13px; font-weight: 600; margin-top: 2px; }
.mention { color: #7c6af5; font-weight: 600; background: rgba(124,106,245,0.12); padding: 0 3px; border-radius: 3px; }
.msg-actions { display: none; position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: #1e2435; border: 1px solid #2a3050; border-radius: 8px; padding: 3px; gap: 2px; }
.msg-action-btn { background: none; border: none; color: #8b93b0; cursor: pointer; padding: 4px 7px; border-radius: 5px; font-size: 13px; }
.msg-action-btn:hover { background: #2a3050; color: #e8eaf0; }
.msg-action-btn.danger:hover { color: #e05a5a; }
.typing-bar { padding: 4px 28px; font-size: 12px; color: #8b93b0; min-height: 22px; flex-shrink: 0; }
.typing-dot { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: #8b93b0; margin: 0 1px; animation: tdot 1.2s infinite; }
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes tdot { 0%,60%,100%{opacity:0.3;transform:scale(1)}30%{opacity:1;transform:scale(1.3)} }

/* INPUT */
.input-area { padding: 10px 20px 14px; border-top: 1px solid #2a3050; background: #171b26; flex-shrink: 0; }
.input-toolbar { display: flex; gap: 6px; margin-bottom: 8px; }
.toolbar-btn { padding: 5px 10px; background: #1e2435; border: 1px solid #2a3050; border-radius: 6px; color: #8b93b0; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.toolbar-btn:hover { border-color: #5b8af0; color: #5b8af0; }
.img-preview-wrap { margin-bottom: 8px; display: none; position: relative; width: fit-content; }
.img-preview { max-height: 80px; border-radius: 8px; border: 1px solid #2a3050; }
.img-preview-rm { position: absolute; top: -8px; right: -8px; width: 20px; height: 20px; border-radius: 50%; background: #e05a5a; border: none; color: #fff; cursor: pointer; font-size: 11px; display: flex; align-items: center; justify-content: center; }
.input-row { display: flex; gap: 8px; align-items: flex-end; }
.msg-input { flex: 1; padding: 11px 16px; background: #1e2435; border: 1px solid #2a3050; border-radius: 12px; color: #e8eaf0; font-size: 14px; outline: none; font-family: inherit; resize: none; max-height: 120px; line-height: 1.5; }
.msg-input:focus { border-color: #5b8af0; }
.send-btn { width: 42px; height: 42px; border-radius: 8px; background: #5b8af0; border: none; color: #fff; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.send-btn:hover { opacity: 0.85; }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.mention-list { background: #1e2435; border: 1px solid #2a3050; border-radius: 8px; padding: 4px; margin-bottom: 4px; display: none; max-height: 160px; overflow-y: auto; }
.mention-item { padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.mention-item:hover, .mention-item.selected { background: #5b8af0; color: #fff; }

/* CONTEXT MENU */
.ctx-menu { position: fixed; background: #1e2435; border: 1px solid #2a3050; border-radius: 10px; padding: 6px; min-width: 170px; z-index: 500; box-shadow: 0 8px 24px rgba(0,0,0,0.5); display: none; }
.ctx-item { padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.ctx-item:hover { background: #2a3050; }
.ctx-item.danger { color: #e05a5a; }
.ctx-item.danger:hover { background: rgba(224,90,90,0.15); }
.ctx-sep { height: 1px; background: #2a3050; margin: 4px 0; }

/* MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal { background: #171b26; border: 1px solid #2a3050; border-radius: 16px; padding: 28px; width: 380px; max-width: 95vw; max-height: 85vh; overflow-y: auto; }
.modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
.modal label { font-size: 12px; color: #8b93b0; display: block; margin-bottom: 5px; font-weight: 600; }
.modal input[type=text], .modal input[type=email], .modal input[type=password] { width: 100%; padding: 10px 12px; margin-bottom: 14px; background: #1e2435; border: 1px solid #2a3050; border-radius: 8px; color: #e8eaf0; font-size: 14px; outline: none; }
.modal input:focus { border-color: #5b8af0; }
.modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.btn-cancel { padding: 9px 16px; background: #1e2435; border: 1px solid #2a3050; border-radius: 8px; color: #8b93b0; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-ok { padding: 9px 16px; background: #5b8af0; border: none; border-radius: 8px; color: #fff; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-danger { padding: 9px 16px; background: none; border: 1px solid #e05a5a; border-radius: 8px; color: #e05a5a; cursor: pointer; font-size: 13px; font-weight: 600; }
.color-presets { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.color-dot { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: border-color 0.15s; }
.color-dot.sel { border-color: #fff; }
.preview-text { padding: 8px 12px; background: #1e2435; border-radius: 8px; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.tpl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tpl-card { padding: 12px; border: 1px solid #2a3050; border-radius: 8px; cursor: pointer; text-align: center; transition: all 0.15s; }
.tpl-card:hover { border-color: #5b8af0; background: #1e2435; }
.tpl-emoji { font-size: 22px; margin-bottom: 4px; }
.tpl-name { font-size: 12px; font-weight: 600; color: #8b93b0; }
.user-list { max-height: 280px; overflow-y: auto; }
.user-list-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.user-list-item:hover { background: #1e2435; }
.user-list-item .uname { font-size: 13px; font-weight: 600; }
.user-list-item .uemail { font-size: 11px; color: #8b93b0; }

/* SERVER SETTINGS */
.member-item { display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;margin-bottom:4px;background:#1e2435; }
.member-info { flex:1;min-width:0; }
.member-name { font-size:13px;font-weight:600; }
.member-role { font-size:11px;color:#8b93b0; }
.member-actions { display:flex;gap:6px; }
.member-btn { padding:5px 10px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none; }
.member-btn.admin { background:#5b8af033;color:#5b8af0;border:1px solid #5b8af0; }
.member-btn.kick { background:#f0b44f33;color:#f0b44f;border:1px solid #f0b44f; }
.member-btn.ban { background:#e05a5a33;color:#e05a5a;border:1px solid #e05a5a; }
.member-btn.unban { background:#4caf8833;color:#4caf88;border:1px solid #4caf88; }
.perm-item { display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:8px;margin-bottom:4px;background:#1e2435; }
.perm-name { font-size:13px;font-weight:600; }
.toggle-switch { position:relative;width:40px;height:22px;cursor:pointer; }
.toggle-switch input { opacity:0;width:0;height:0; }
.toggle-slider { position:absolute;inset:0;background:#2a3050;border-radius:11px;transition:0.2s; }
.toggle-slider::before { content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#8b93b0;border-radius:50%;transition:0.2s; }
.toggle-switch input:checked + .toggle-slider { background:#5b8af0; }
.toggle-switch input:checked + .toggle-slider::before { transform:translateX(18px);background:#fff; }
.readonly-badge { font-size:10px;padding:2px 6px;background:#f0b44f22;color:#f0b44f;border:1px solid #f0b44f44;border-radius:4px;margin-left:4px; }

/* LIGHTBOX */
#lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: none; align-items: center; justify-content: center; z-index: 999; cursor: zoom-out; }
#lightbox.open { display: flex; }
#lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 8px; }

/* TOAST */
#toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(60px); background: #1e2435; border: 1px solid #2a3050; border-radius: 8px; padding: 10px 18px; font-size: 13px; transition: transform 0.3s; z-index: 9999; pointer-events: none; }
#toast.show { transform: translateX(-50%) translateY(0); }

.unread-sep { text-align: center; margin: 8px 0; position: relative; }
.unread-sep span { background: rgba(224,90,90,0.15); color: #e05a5a; padding: 2px 12px; font-size: 11px; border-radius: 10px; font-weight: 700; }
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">TeamChat</div>
    <div class="auth-sub">チームのコミュニケーションをシンプルに</div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">ログイン</button>
      <button class="auth-tab" onclick="switchTab('signup')">新規登録</button>
    </div>
    <div id="login-form">
      <input type="email" id="login-email" placeholder="メールアドレス">
      <input type="password" id="login-pass" placeholder="パスワード">
      <button class="btn-primary" onclick="doLogin()">ログイン</button>
    </div>
    <div id="signup-form" style="display:none">
      <input type="text" id="signup-username" placeholder="ユーザー名">
      <input type="email" id="signup-email" placeholder="メールアドレス">
      <input type="password" id="signup-pass" placeholder="パスワード（6文字以上）">
      <button class="btn-primary" onclick="doSignup()">登録する</button>
    </div>
    <div class="auth-err" id="auth-err"></div>
    <div class="auth-ok" id="auth-ok"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-logo" id="server-logo" onclick="showRules()" style="cursor:pointer" title="サーバー情報">💬 TeamChat</span>
      <div style="display:flex;gap:2px">
        <button class="icon-btn hidden" id="server-settings-btn" onclick="openServerModal()" title="サーバー設定">🛠</button>
        <button class="icon-btn" onclick="openModal('settings-modal')" title="個人設定">⚙</button>
      </div>
    </div>
    <div class="sidebar-scroll">
      <div class="sidebar-section">
        <div class="section-label">
          チャンネル
          <button class="icon-btn hidden" id="add-room-btn" onclick="openModal('room-modal')" title="追加">+</button>
        </div>
        <div id="rooms-list"></div>
      </div>
      <div class="sidebar-section">
        <div class="section-label">
          ダイレクトメッセージ
          <button class="icon-btn" onclick="openModal('dm-user-modal')" title="DMを開始">+</button>
        </div>
        <div id="dm-list"></div>
      </div>
      <div class="sidebar-section">
        <div class="section-label">オンラインメンバー</div>
        <div id="online-list"></div>
      </div>
    </div>
    <div class="sidebar-footer">
      <div class="avatar-wrap">
        <div class="avatar" id="sidebar-avatar">U</div>
      </div>
      <div class="user-name" id="sidebar-username">...</div>
      <button class="icon-btn" onclick="doLogout()" title="ログアウト">⎋</button>
    </div>
  </div>

  <div class="main">
    <div class="main-header">
      <span class="channel-title" id="room-title">チャンネルを選択</span>
      <span class="channel-desc" id="room-desc"></span>
      <button class="header-btn" onclick="toggleSearch()" title="検索">🔍</button>
    </div>
    <div class="search-bar" id="search-bar">
      <input class="search-input" id="search-input" placeholder="メッセージを検索..." oninput="doSearch()">
      <div class="search-results" id="search-results"></div>
    </div>
    <div class="messages-wrap" id="messages-wrap">
      <div class="empty-state"><div class="empty-icon">💬</div><div>チャンネルを選んでください</div></div>
    </div>
    <div class="typing-bar" id="typing-bar"></div>
    <div class="input-area" id="input-area" style="display:none">
      <div class="input-toolbar">
        <button class="toolbar-btn" onclick="openModal('template-modal')">⚡ テンプレート</button>
        <label class="toolbar-btn" style="cursor:pointer">
          🖼 画像<input type="file" id="img-input" accept="image/*" style="display:none" onchange="handleImg(this)">
        </label>
      </div>
      <div class="img-preview-wrap" id="img-preview-wrap">
        <img class="img-preview" id="img-preview" src="">
        <button class="img-preview-rm" onclick="removeImg()">✕</button>
      </div>
      <div class="mention-list" id="mention-list"></div>
      <div class="input-row">
        <textarea class="msg-input" id="msg-input" placeholder="メッセージを入力... (@でメンション)" rows="1"
          onkeydown="onMsgKey(event)" oninput="onInputChange();autoResize(this)"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>
</div>

<!-- CONTEXT MENU (channel) -->
<div class="ctx-menu" id="ctx-menu">
  <div class="ctx-item" id="ctx-edit-btn" onclick="ctxEdit()">✏️ 名前・説明を編集</div>
  <div class="ctx-sep"></div>
  <div class="ctx-item danger" id="ctx-delete-btn" onclick="ctxDelete()">🗑 チャンネルを削除</div>
</div>

<!-- MODALS -->
<div class="modal-overlay" id="room-modal">
  <div class="modal">
    <h3>チャンネルを作成</h3>
    <label>チャンネル名</label>
    <input type="text" id="new-room-name" placeholder="例: プロジェクトA">
    <label>説明（任意）</label>
    <input type="text" id="new-room-desc" placeholder="このチャンネルの用途">
    <div class="modal-footer">

var authTab = 'login';
function switchTab(tab) {
  authTab = tab;
  document.querySelectorAll('.auth-tab').forEach(function(t,i){ t.classList.toggle('active',(i===0)===(tab==='login')); });
  document.getElementById('login-form').style.display = tab==='login'?'block':'none';
  document.getElementById('signup-form').style.display = tab==='signup'?'block':'none';
  document.getElementById('auth-err').textContent='';
  document.getElementById('auth-ok').textContent='';
}
function doLogin() {
  var email=document.getElementById('login-email').value.trim(), pass=document.getElementById('login-pass').value;
  if(!email||!pass){setAuthErr('入力してください');return;}
  sb.auth.signInWithPassword({email:email,password:pass}).then(function(r){
    if(r.error){setAuthErr(r.error.message==='Invalid login credentials'?'メールまたはパスワードが違います':r.error.message);}
  });
}
function doSignup() {
  var u=document.getElementById('signup-username').value.trim(), e=document.getElementById('signup-email').value.trim(), p=document.getElementById('signup-pass').value;
  if(!u||!e||!p){setAuthErr('すべて入力してください');return;}
  sb.auth.signUp({email:e,password:p,options:{data:{username:u}}}).then(function(r){
    if(r.error){setAuthErr(r.error.message);}
    else{document.getElementById('auth-ok').textContent='✅ 登録完了！ログインしてください';switchTab('login');}
  });
}
function setAuthErr(m){document.getElementById('auth-err').textContent='❌ '+m;}
function doLogout() {
  if(realtimeSub) sb.removeChannel(realtimeSub);
  if(dmSub) sb.removeChannel(dmSub);
  if(typingCh) sb.removeChannel(typingCh);
  if(presenceCh) sb.removeChannel(presenceCh);
  sb.auth.signOut();
}

function renderColorPresets() {
  var wrap = document.getElementById('color-presets');
  wrap.innerHTML = '';
  for (var i = 0; i < COLOR_PRESETS.length; i++) {
    var c = COLOR_PRESETS[i];
    var dot = document.createElement('div');
    dot.className = 'color-dot';
    dot.style.background = c;
    dot.dataset.color = c;
    (function(col){ dot.addEventListener('click', function(){ selectColor(col); }); })(c);
    wrap.appendChild(dot);
  }
  var customEl = document.getElementById('custom-color');
  if (customEl) {
    customEl.addEventListener('input', function() {
      document.getElementById('preview-text').style.color = this.value;
      var hexEl = document.getElementById('hex-color');
      if (hexEl) hexEl.value = this.value;
      updateColorSel(this.value);
    });
  }
  var hexEl2 = document.getElementById('hex-color');
  if (hexEl2) {
    hexEl2.addEventListener('input', function() {
      var val = this.value.trim();
      if (/^#[0-9a-fA-F]{6}$/.test(val)) {
        document.getElementById('custom-color').value = val;
        document.getElementById('preview-text').style.color = val;
        updateColorSel(val);
      }
    });
  }
}

// ===== PRESENCE (online) =====
function setupPresence() {
  presenceCh = sb.channel('online-users', {config:{presence:{key:currentUser.id}}});
  presenceCh.on('presence',{event:'sync'},function(){
    var state=presenceCh.presenceState();
    onlineUsers={};
    Object.keys(state).forEach(function(k){ onlineUsers[k]=true; });
    renderOnlineList();
    renderDmList();
  }).subscribe(function(status){
    if(status==='SUBSCRIBED'){
      presenceCh.track({user_id:currentUser.id,username:currentProfile?currentProfile.username:''});
    }
  });
}
function renderOnlineList() {
  var el = document.getElementById('online-list');
  if (!el) return;
  var online = allProfiles.filter(function(p) { return onlineUsers[p.id] && p.id !== currentUser.id; });
  if (online.length === 0) {
    el.innerHTML = '<div style="font-size:12px;color:#8b93b0;padding:4px 10px">なし</div>';
    return;
  }
  el.innerHTML = '';
  for (var i = 0; i < online.length; i++) {
    var p = online[i];
    var color = p.display_color || '#5b8af0';
    var div = document.createElement('div');
    div.className = 'room-item';
    div.innerHTML = '<span class="online-dot"></span><span style="font-size:13px">' + esc(p.username || p.id.slice(0,8)) + '</span>';
    (function(pid, puname, pcolor) {
      div.addEventListener('click', function() { openDm(pid, puname, pcolor); });
    })(p.id, p.username || '', color);
    el.appendChild(div);
  }
}
function loadRooms() {
  sb.from('rooms').select('*').order('created_at').then(function(r){
    rooms=r.data||[];
    loadRoomReads();
  });
}
function loadRoomReads() {
  sb.from('room_reads').select('*').eq('user_id',currentUser.id).then(function(r){
    (r.data||[]).forEach(function(rr){ lastReadMap[rr.room_id]=rr.last_read_at; });
    checkUnreads();
  });
}
function checkUnreads() {
  var pending=rooms.length;
  if(pending===0){renderRooms();if(rooms.length>0)selectRoom(rooms[0]);return;}
  rooms.forEach(function(room){
    var lastRead=lastReadMap[room.id];
    var query=sb.from('messages').select('id',{count:'exact',head:true}).eq('room_id',room.id);
    if(lastRead) query=query.gt('created_at',lastRead);
    query.neq('user_id',currentUser.id).then(function(r){
      unreadRooms[room.id]=(r.count||0);
      pending--;
      if(pending<=0){renderRooms();if(!currentRoom&&rooms.length>0)selectRoom(rooms[0]);}
    });
  });
}
function renderRooms() {
  var el = document.getElementById('rooms-list');
  if (!el) return;
  el.innerHTML = '';
  for (var i = 0; i < rooms.length; i++) {
    var r = rooms[i];
    var active = (currentRoom && currentRoom.id === r.id && viewMode === 'room') ? ' active' : '';
    var badge = unreadRooms[r.id] > 0 ? '<span class="badge">' + unreadRooms[r.id] + '</span>' : '';
    var div = document.createElement('div');
    div.className = 'room-item' + active;
    div.innerHTML = '# ' + esc(r.name) + badge;
    (function(room) {
      div.addEventListener('click', function() { selectRoom(room); });
      div.addEventListener('contextmenu', function(e) { showCtx(e, room.id); });
    })(r);
    el.appendChild(div);
  }
}
function selectRoomById(id){for(var i=0;i<rooms.length;i++){if(rooms[i].id===id){selectRoom(rooms[i]);return;}}}
function selectRoom(room) {
  currentRoom=room; currentDmUser=null; viewMode='room';
  renderRooms(); renderDmList();
  document.getElementById('room-title').textContent='# '+room.name+(room.is_readonly?' 🔒':'');
  document.getElementById('room-desc').textContent=room.description||'';
  var inputArea=document.getElementById('input-area');
  if(room.is_readonly && !isAdmin){
    inputArea.style.display='block';
    inputArea.innerHTML='<div style="text-align:center;padding:12px;color:#8b93b0;font-size:13px">🔒 このチャンネルは読み取り専用です</div>';
  } else {
    if(!inputArea.querySelector('.msg-input')){
      rebuildInputArea(inputArea);
    }
    inputArea.style.display='block';
  }
  document.getElementById('typing-bar').innerHTML='';
  typingUsers={};
  if(realtimeSub){sb.removeChannel(realtimeSub);realtimeSub=null;}
  markRoomRead(room.id);
  loadMessages('room');
  subscribeRoomMessages();
}
function markRoomRead(roomId) {
  unreadRooms[roomId]=0;
  renderRooms();
  lastReadMap[roomId]=new Date().toISOString();
  sb.from('room_reads').upsert({user_id:currentUser.id,room_id:roomId,last_read_at:new Date().toISOString()});
}
function createRoom() {
  var name=document.getElementById('new-room-name').value.trim();
  var desc=document.getElementById('new-room-desc').value.trim();
  if(!name)return;
  sb.from('rooms').insert({name:name,description:desc,created_by:currentUser.id}).select().single().then(function(r){
    if(r.error){showToast('❌ '+r.error.message);return;}
    rooms.push(r.data); renderRooms(); closeModal('room-modal');
    document.getElementById('new-room-name').value=''; document.getElementById('new-room-desc').value='';
    selectRoom(r.data);
  });
}

function showCtx(e,roomId) {
  e.preventDefault();
  if(!isAdmin)return;
  ctxRoomId=roomId;
  var menu=document.getElementById('ctx-menu');
  menu.style.display='block';
  var x=e.clientX, y=e.clientY;
  if(x+180>window.innerWidth) x=window.innerWidth-185;
  if(y+110>window.innerHeight) y=window.innerHeight-115;
  menu.style.left=x+'px'; menu.style.top=y+'px';
}
function hideCtx(){document.getElementById('ctx-menu').style.display='none';}
function ctxEdit() {
  hideCtx();
  var room=rooms.find(function(r){return r.id===ctxRoomId;});
  if(!room)return;
  document.getElementById('edit-room-name').value=room.name;
  document.getElementById('edit-room-desc').value=room.description||'';
  openModal('edit-room-modal');
}
function saveRoom() {
  var name=document.getElementById('edit-room-name').value.trim();
  var desc=document.getElementById('edit-room-desc').value.trim();
  if(!name)return;
  sb.from('rooms').update({name:name,description:desc}).eq('id',ctxRoomId).then(function(r){
    if(r.error){showToast('❌ '+r.error.message);return;}
    for(var i=0;i<rooms.length;i++){if(rooms[i].id===ctxRoomId){rooms[i].name=name;rooms[i].description=desc;break;}}
    if(currentRoom&&currentRoom.id===ctxRoomId){currentRoom.name=name;currentRoom.description=desc;document.getElementById('room-title').textContent='# '+name;document.getElementById('room-desc').textContent=desc;}
    renderRooms(); closeModal('edit-room-modal'); showToast('✅ 更新しました');
  });
}
function ctxDelete() {
  hideCtx();
  var room=rooms.find(function(r){return r.id===ctxRoomId;});
  if(!room)return;
  document.getElementById('delete-room-name').textContent=room.name;
  openModal('delete-room-modal');
}

function loadMessages(mode) {

  wrap.innerHTML = '<div style="text-align:center;padding:40px;color:#8b93b0;font-size:13px">読み込み中...</div>';

    sb.from('messages')
      .select('*, profiles(username, display_color)')
      .eq('room_id', currentRoom.id)
      .order('created_at', { ascending: true })
      .limit(100)
      .then(function(r) {

          wrap.innerHTML = '<div style="text-align:center;padding:40px;color:#e05a5a">エラー: ' + esc(r.error.message) + '</div>';

      .select('*, profiles!direct_messages_sender_id_fkey(username, display_color)')

      .limit(100)
      .then(function(r) {

function renderMessages(mode) {
  var wrap = document.getElementById('messages-wrap');
  if (messagesCache.length === 0) {
    wrap.innerHTML = '<div class="empty-state"><div class="empty-icon">🌱</div><div>最初のメッセージを送りましょう！</div></div>';
    return;
  }
  wrap.innerHTML = '';
  var lastUser = null;
  var lastDay = null;
  for (var i = 0; i < messagesCache.length; i++) {
    var msg = messagesCache[i];
    var day = new Date(msg.created_at).toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric' });
    if (day !== lastDay) {
      var sep = document.createElement('div');
      sep.className = 'day-sep';
      sep.innerHTML = '<span>' + esc(day) + '</span>';
      wrap.appendChild(sep);
      lastDay = day;
      lastUser = null;
    }
    var userId = msg.user_id || msg.sender_id;
    var el = mode === 'dm' ? buildDmMsgHtml(msg, lastUser) : buildMsgHtml(msg, lastUser);
    wrap.appendChild(el);
    lastUser = userId;
  }
}


function buildMsgHtml(msg, lastUserId) {
  var profile = msg.profiles || {};
  var name = profile.username || '不明';
  var color = msg.color || profile.display_color || '#5b8af0';
  var time = new Date(msg.created_at).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
  var isFirst = msg.user_id !== lastUserId;

  var wrap = document.createElement('div');
  wrap.className = 'msg' + (isFirst ? ' first-in-group' : '');
  wrap.id = 'msg-' + msg.id;

  // Avatar
  // Handle gradient color
  var isGradient = color && color.indexOf('gradient:') === 0;
  var gradColors = isGradient ? color.replace('gradient:','').split(',') : null;
  var displayColor = isGradient ? (gradColors[0] || '#5b8af0') : color;

  var avatarEl = document.createElement('div');
  if (isFirst) {
    avatarEl.className = 'msg-avatar';
    avatarEl.style.background = displayColor + '22';
    avatarEl.style.color = displayColor;
    avatarEl.textContent = name[0].toUpperCase();
  } else {
    avatarEl.className = 'msg-spacer';
  }
  wrap.appendChild(avatarEl);

  // Body
  var body = document.createElement('div');
  body.className = 'msg-body';

  if (isFirst) {
    var headerEl = document.createElement('div');
    headerEl.className = 'msg-header';
    var authorEl = document.createElement('span');
    authorEl.className = 'msg-author';
    if (isGradient && gradColors) {
      authorEl.style.background = 'linear-gradient(135deg,' + gradColors[0] + ',' + gradColors[1] + ')';
      authorEl.style.webkitBackgroundClip = 'text';
      authorEl.style.webkitTextFillColor = 'transparent';
      authorEl.style.backgroundClip = 'text';
    } else {
      authorEl.style.color = color;
    }
    authorEl.textContent = name;
    authorEl.addEventListener('click', (function(n){ return function(){ mentionUser(n); }; })(name));
    var timeEl = document.createElement('span');
    timeEl.className = 'msg-time';
    timeEl.textContent = time;
    headerEl.appendChild(authorEl);
    headerEl.appendChild(timeEl);
    body.appendChild(headerEl);
  }

  // Content - apply gradient to text too
  var contentEl = buildContent(msg, color);
  if (isGradient && gradColors) {
    var textEls = contentEl.querySelectorAll('.msg-text');
    textEls.forEach(function(el) {
      el.style.background = 'linear-gradient(135deg,' + gradColors[0] + ',' + gradColors[1] + ')';
      el.style.webkitBackgroundClip = 'text';
      el.style.webkitTextFillColor = 'transparent';
      el.style.backgroundClip = 'text';
    });
  }
  body.appendChild(contentEl);
  wrap.appendChild(body);

  // Actions
  var canDelete = isAdmin || (currentUser && msg.user_id === currentUser.id);
  if (canDelete) {
    var actions = document.createElement('div');
    actions.className = 'msg-actions';
    var delBtn = document.createElement('button');
    delBtn.className = 'msg-action-btn danger';
    delBtn.title = '削除';
    delBtn.textContent = '🗑';
    delBtn.addEventListener('click', (function(id){ return function(){ deleteMsg(id, 'room'); }; })(msg.id));
    actions.appendChild(delBtn);
    wrap.appendChild(actions);
  }

  return wrap;
}


function buildDmMsgHtml(msg, lastSenderId) {
  var isMine = msg.sender_id === currentUser.id;
  var profile = msg.profiles || {};
  var name = isMine ? (currentProfile ? currentProfile.username : 'あなた') : (currentDmUser ? currentDmUser.username : profile.username || '相手');
  var color = isMine ? (currentProfile ? currentProfile.display_color : '#5b8af0') : (currentDmUser ? currentDmUser.display_color : profile.display_color || '#5b8af0');
  var time = new Date(msg.created_at).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
  var isFirst = msg.sender_id !== lastSenderId;

  var wrap = document.createElement('div');
  wrap.className = 'msg' + (isFirst ? ' first-in-group' : '');
  wrap.id = 'msg-' + msg.id;

  var avatarEl = document.createElement('div');
  if (isFirst) {
    avatarEl.className = 'msg-avatar';
    avatarEl.style.background = color + '22';
    avatarEl.style.color = color;
    avatarEl.textContent = name[0].toUpperCase();
  } else {
    avatarEl.className = 'msg-spacer';
  }
  wrap.appendChild(avatarEl);

  var body = document.createElement('div');
  body.className = 'msg-body';

  if (isFirst) {
    var headerEl = document.createElement('div');
    headerEl.className = 'msg-header';
    var authorEl = document.createElement('span');
    authorEl.className = 'msg-author';
    authorEl.style.color = color;
    authorEl.textContent = name;
    var timeEl = document.createElement('span');
    timeEl.className = 'msg-time';
    timeEl.textContent = time;
    headerEl.appendChild(authorEl);
    headerEl.appendChild(timeEl);
    body.appendChild(headerEl);
  }

  var contentEl = document.createElement('div');
  if (msg.image_url) {
    var img = document.createElement('img');
    img.className = 'msg-img';
    img.src = msg.image_url;
    img.loading = 'lazy';
    img.addEventListener('click', (function(url){ return function(){ openLightbox(url); }; })(msg.image_url));
    contentEl.appendChild(img);
  } else {
    var textEl = document.createElement('div');
    textEl.className = 'msg-text';
    textEl.style.color = color;
    textEl.textContent = msg.content || '';
    contentEl.appendChild(textEl);
  }
  body.appendChild(contentEl);
  wrap.appendChild(body);

  var canDelete = isMine || isAdmin;
  if (canDelete) {
    var actions = document.createElement('div');
    actions.className = 'msg-actions';
    var delBtn = document.createElement('button');
    delBtn.className = 'msg-action-btn danger';
    delBtn.title = '削除';
    delBtn.textContent = '🗑';
    delBtn.addEventListener('click', (function(id){ return function(){ deleteMsg(id, 'dm'); }; })(msg.id));
    actions.appendChild(delBtn);
    wrap.appendChild(actions);
  }

  return wrap;
}


function buildContent(msg, color) {
  var wrapper = document.createElement('div');
  if (msg.message_type === 'image' && msg.image_url) {
    var img = document.createElement('img');
    img.className = 'msg-img';
    img.src = msg.image_url;
    img.loading = 'lazy';
    img.addEventListener('click', (function(url){ return function(){ openLightbox(url); }; })(msg.image_url));
    wrapper.appendChild(img);
    if (msg.content) {
      var t = document.createElement('div');
      t.className = 'msg-text';
      t.style.color = color;
      t.innerHTML = formatText(msg.content, color);
      wrapper.appendChild(t);
    }
    return wrapper;
  }
  if (msg.message_type === 'template') {
    var b = document.createElement('div');
    b.className = 'template-bubble';
    b.style.cssText = 'background:' + color + '22;color:' + color + ';border:1px solid ' + color + '44';
    b.textContent = msg.content;
    wrapper.appendChild(b);
    return wrapper;
  }
  var d = document.createElement('div');
  d.className = 'msg-text';
  d.style.color = color;
  d.innerHTML = formatText(msg.content || '', color);
  wrapper.appendChild(d);
  return wrapper;
}


function formatText(text, color) {
  var h = esc(text);
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/@(\S+)/g, '<span class="mention">@$1</span>');
  h = h.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener" style="color:#5b8af0;text-decoration:underline">$1</a>');
  return h;
}

function subscribeRoomMessages() {
  realtimeSub = sb.channel('room-msg-' + currentRoom.id)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'room_id=eq.' + currentRoom.id }, function(payload) {
      sb.from('messages').select('*, profiles(username, display_color)').eq('id', payload.new.id).single().then(function(r) {
        if (!r.data) return;
        var prevUser = messagesCache.length > 0 ? messagesCache[messagesCache.length - 1].user_id : null;
        messagesCache.push(r.data);
        var wrap = document.getElementById('messages-wrap');
        var empty = wrap.querySelector('.empty-state');
        if (empty) wrap.innerHTML = '';
        wrap.appendChild(buildMsgHtml(r.data, prevUser));
        var atBottom = wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight < 100;
        if (atBottom) scrollBottom();
        markRoomRead(currentRoom.id);
      });
    })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, function(payload) {
      var el = document.getElementById('msg-' + payload.old.id);
      if (el) el.remove();
      messagesCache = messagesCache.filter(function(m) { return m.id !== payload.old.id; });
    })
    .subscribe();
}


function subscribeDmMessages() {

  realtimeSub = sb.channel('dm-conv-' + [currentUser.id, uid].sort().join('-'))

      var n = payload.new;

      sb.from('direct_messages').select('*, profiles!direct_messages_sender_id_fkey(username, display_color)').eq('id', n.id).single().then(function(r) {

        messagesCache.push(r.data);

        var atBottom = wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight < 100;

      });

    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'direct_messages' }, function(payload) {

      if (el) el.remove();
      messagesCache = messagesCache.filter(function(m) { return m.id !== payload.old.id; });

function appendMsgEl(el) {

  if (empty) wrap.innerHTML = '';
  if (el instanceof Element) {
    wrap.appendChild(el);
  } else {
    var div = document.createElement('div');
    div.innerHTML = el;
    wrap.appendChild(div.firstChild || div);
  }
}


function deleteMsg(id, mode) {
  if(!confirm('このメッセージを削除しますか？'))return;

// ===== SEND =====
function sendMessage() {
  if(!currentUser)return;
  if(viewMode==='room'&&!currentRoom)return;
  if(viewMode==='dm'&&!currentDmUser)return;
  var input=document.getElementById('msg-input');
  var text=input.value.trim();
  if(!text&&!pendingImg)return;
  var btn=document.getElementById('send-btn');
  btn.disabled=true;
  var color=(currentProfile&&currentProfile.display_color)?currentProfile.display_color:'#5b8af0';

  if(pendingImg){
    var ext=pendingImg.name.split('.').pop();
    var path=currentUser.id+'/'+Date.now()+'.'+ext;
    sb.storage.from('chat-images').upload(path,pendingImg).then(function(up){
      if(up.error){showToast('❌ 画像アップ失敗: '+up.error.message);btn.disabled=false;return;}
      var url=sb.storage.from('chat-images').getPublicUrl(path).data.publicUrl;
      var data=viewMode==='room'
        ?{room_id:currentRoom.id,user_id:currentUser.id,content:text||null,message_type:'image',image_url:url,color:color}
        :{sender_id:currentUser.id,receiver_id:currentDmUser.id,content:text||null,image_url:url,color:color};
      var table=viewMode==='dm'?'direct_messages':'messages';
      sb.from(table).insert(data).then(function(){btn.disabled=false;input.value='';input.style.height='auto';removeImg();input.focus();});
    });
  } else {
    var table=viewMode==='dm'?'direct_messages':'messages';
    var data=viewMode==='room'
      ?{room_id:currentRoom.id,user_id:currentUser.id,content:text,message_type:'text',color:color}
      :{sender_id:currentUser.id,receiver_id:currentDmUser.id,content:text,color:color};
    sb.from(table).insert(data).then(function(r){
      btn.disabled=false;
      if(r.error){showToast('❌ 送信失敗: '+r.error.message);return;}
      input.value=''; input.style.height='auto'; input.focus();
      clearTypingSignal();
    });
  }
}

function sendTemplate(tpl) {
  if(!currentRoom||!currentUser||viewMode!=='room')return;
  sb.from('messages').insert({room_id:currentRoom.id,user_id:currentUser.id,content:tpl.emoji+' '+tpl.text,message_type:'template',color:tpl.color}).then(function(){closeModal('template-modal');});
}

function onMsgKey(e) {
  if(mentionMatches.length>0){
    if(e.key==='ArrowDown'){e.preventDefault();mentionIndex=Math.min(mentionIndex+1,mentionMatches.length-1);renderMentionList();return;}
    if(e.key==='ArrowUp'){e.preventDefault();mentionIndex=Math.max(mentionIndex-1,0);renderMentionList();return;}
    if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();insertMention(mentionMatches[mentionIndex<0?0:mentionIndex]);return;}
    if(e.key==='Escape'){clearMentionList();return;}
  }
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}
}

// ===== @MENTION =====
function onInputChange() {
  onTyping();
  var input=document.getElementById('msg-input');
  var val=input.value;
  var cursor=input.selectionStart;
  var before=val.slice(0,cursor);
  var match=before.match(/@(\S*)$/);
  if(match){
    var query=match[1].toLowerCase();
    mentionMatches=allProfiles.filter(function(p){
      return p.id!==currentUser.id&&(p.username||'').toLowerCase().indexOf(query)===0;
    }).slice(0,5);
    mentionIndex=-1;
    renderMentionList();
  } else {
    clearMentionList();
  }
}
function renderMentionList() {
  var el = document.getElementById('mention-list');
  if (!el) return;
  if (mentionMatches.length === 0) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.innerHTML = '';
  for (var i = 0; i < mentionMatches.length; i++) {
    var p = mentionMatches[i];
    var color = p.display_color || '#5b8af0';
    var div = document.createElement('div');
    div.className = 'mention-item' + (i === mentionIndex ? ' selected' : '');
    div.innerHTML = '<div class="avatar" style="background:' + color + ';width:24px;height:24px;font-size:11px">' + esc((p.username||'?')[0].toUpperCase()) + '</div>' + esc(p.username || '');
    (function(profile) {
      div.addEventListener('click', function() { insertMention(profile); });
    })(p);
    el.appendChild(div);
  }
}
function insertMention(profile) {
  if(!profile)return;
  var input=document.getElementById('msg-input');
  var val=input.value, cursor=input.selectionStart;
  var before=val.slice(0,cursor), after=val.slice(cursor);
  var newBefore=before.replace(/@\S*$/,'@'+profile.username+' ');
  input.value=newBefore+after;
  input.selectionStart=input.selectionEnd=newBefore.length;
  clearMentionList(); input.focus();
}
function clearMentionList(){mentionMatches=[];mentionIndex=-1;document.getElementById('mention-list').style.display='none';}
function mentionUser(name){var input=document.getElementById('msg-input');input.value+='@'+name+' ';input.focus();}

// ===== TYPING =====
function setupTyping() {
  typingCh=sb.channel('typing-global');
  typingCh.on('broadcast',{event:'typing'},function(payload){
    var p=payload.payload;
    if(!p||p.user_id===currentUser.id)return;
    var inSameCtx=(viewMode==='room'&&p.room_id&&currentRoom&&p.room_id===currentRoom.id)||(viewMode==='dm'&&p.dm_with&&currentDmUser&&p.dm_with===currentUser.id);
    if(!inSameCtx)return;
    if(p.typing){typingUsers[p.user_id]=p.username;}else{delete typingUsers[p.user_id];}
    renderTyping();
  }).subscribe();
}
function onTyping() {
  if(!typingCh||!currentProfile)return;
  var payload={user_id:currentUser.id,username:currentProfile.username,typing:true};
  if(viewMode==='room'&&currentRoom) payload.room_id=currentRoom.id;
  if(viewMode==='dm'&&currentDmUser) payload.dm_with=currentDmUser.id;
  typingCh.send({type:'broadcast',event:'typing',payload:payload});
  clearTimeout(typingTimer);
  typingTimer=setTimeout(clearTypingSignal,3000);
}
function clearTypingSignal() {
  if(!typingCh||!currentProfile)return;
  var payload={user_id:currentUser.id,username:currentProfile.username,typing:false};
  if(viewMode==='room'&&currentRoom) payload.room_id=currentRoom.id;
  if(viewMode==='dm'&&currentDmUser) payload.dm_with=currentDmUser.id;
  typingCh.send({type:'broadcast',event:'typing',payload:payload});
}
function renderTyping() {
  var el=document.getElementById('typing-bar');
  var users=Object.values(typingUsers);
  if(users.length===0){el.innerHTML='';return;}
  el.innerHTML=esc(users.join('、'))+' が入力中 <span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
}

// ===== SEARCH =====
function toggleSearch() {
  var bar=document.getElementById('search-bar');
  bar.classList.toggle('open');
  if(bar.classList.contains('open')) document.getElementById('search-input').focus();
  else{document.getElementById('search-input').value='';document.getElementById('search-results').innerHTML='';}
}
function doSearch() {
  var q = document.getElementById('search-input').value.trim();
  var res = document.getElementById('search-results');
  if (!q || q.length < 2) { res.innerHTML = ''; return; }
  if (!currentRoom && !currentDmUser) {
    res.innerHTML = '<div style="color:#8b93b0;font-size:12px;padding:4px">チャンネルを選択してから検索してください</div>';
    return;
  }
  var filtered = messagesCache.filter(function(m) {
    return (m.content || '').toLowerCase().indexOf(q.toLowerCase()) !== -1;
  });
  if (filtered.length === 0) {
    res.innerHTML = '<div style="color:#8b93b0;font-size:12px;padding:4px">見つかりませんでした</div>';
    return;
  }
  res.innerHTML = '';
  var shown = filtered.slice(-20).reverse();
  for (var i = 0; i < shown.length; i++) {
    var m = shown[i];
    var profile = m.profiles || {};
    var name = profile.username || '不明';
    var time = new Date(m.created_at).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    var div = document.createElement('div');
    div.className = 'search-result-item';
    div.innerHTML = '<div class="search-result-name">' + esc(name) + ' · ' + time + '</div><div style="font-size:13px">' + esc((m.content || '').slice(0, 60)) + '</div>';
    (function(id){ div.addEventListener('click', function(){ scrollToMsg(id); }); })(m.id);
    res.appendChild(div);
  }
}


function scrollToMsg(id) {
  var el=document.getElementById('msg-'+id);
  if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.background='rgba(91,138,240,0.15)';setTimeout(function(){el.style.background='';},2000);}
}

// ===== IMAGE =====
function handleImg(input) {
  var file=input.files[0]; if(!file)return;
  if(file.size>5*1024*1024){showToast('❌ 5MB以下の画像を選択してください');return;}
  pendingImg=file;
  var reader=new FileReader();
  reader.onload=function(e){document.getElementById('img-preview').src=e.target.result;document.getElementById('img-preview-wrap').style.display='block';};
  reader.readAsDataURL(file); input.value='';
}
function removeImg(){pendingImg=null;document.getElementById('img-preview-wrap').style.display='none';document.getElementById('img-preview').src='';}

// ===== TEMPLATES =====
function renderTemplates() {
  var g = document.getElementById('tpl-grid');
  if (!g) return;
  g.innerHTML = '';
  for (var i = 0; i < TEMPLATES.length; i++) {
    var t = TEMPLATES[i];
    var div = document.createElement('div');
    div.className = 'tpl-card';
    div.innerHTML = '<div class="tpl-emoji">' + t.emoji + '</div><div class="tpl-name">' + esc(t.name) + '</div>';
    (function(tpl){ div.addEventListener('click', function(){ sendTemplate(tpl); }); })(t);
    g.appendChild(div);
  }
}

function openLightbox(url){document.getElementById('lightbox-img').src=url;document.getElementById('lightbox').classList.add('open');}

function rebuildInputArea(inputArea) {
  inputArea.innerHTML = '';

  tplBtn.className = 'toolbar-btn';

  toolbar.appendChild(tplBtn);
  var imgLabel = document.createElement('label');
  imgLabel.className = 'toolbar-btn';
  imgLabel.style.cursor = 'pointer';
  imgLabel.textContent = '🖼 画像';
  var imgInput = document.createElement('input');
  imgInput.type = 'file';
  imgInput.id = 'img-input';
  imgInput.accept = 'image/*';
  imgInput.style.display = 'none';
  imgInput.addEventListener('change', function() { handleImg(this); });
  imgLabel.appendChild(imgInput);
  toolbar.appendChild(imgLabel);
  inputArea.appendChild(toolbar);
  // Preview
  var previewWrap = document.createElement('div');
  previewWrap.className = 'img-preview-wrap';
  previewWrap.id = 'img-preview-wrap';
  var previewImg = document.createElement('img');
  previewImg.className = 'img-preview';
  previewImg.id = 'img-preview';
  var previewRm = document.createElement('button');

  previewRm.textContent = '✕';

  previewWrap.appendChild(previewRm);
  inputArea.appendChild(previewWrap);

// ===== SERVER SETTINGS =====
var serverSettings = { name: 'TeamChat', icon: '💬', description: '', rules: '', message_retention_days: 0 };

function loadServerSettings() {
  sb.from('server_settings').select('*').eq('id', 1).single().then(function(r) {
    if (r.data) {
      serverSettings = r.data;
      applyServerSettings();
    }
  });
}

function applyServerSettings() {
  var logo = document.getElementById('server-logo');
  if (logo) logo.textContent = (serverSettings.icon || '💬') + ' ' + (serverSettings.name || 'TeamChat');
  document.title = serverSettings.name || 'TeamChat';
}

function openServerModal() {
  document.getElementById('server-icon').value = serverSettings.icon || '💬';
  document.getElementById('server-name').value = serverSettings.name || '';
  document.getElementById('server-desc').value = serverSettings.description || '';
  document.getElementById('server-rules').value = serverSettings.rules || '';
  document.getElementById('server-retention').value = serverSettings.message_retention_days || 0;
  switchServerTab('general');
  openModal('server-modal');
  loadMembersList();
  loadChannelPerms();
}

function switchServerTab(tab) {
  var tabs = ['general', 'members', 'channels'];
  tabs.forEach(function(t) {
    var el = document.getElementById('server-tab-' + t);
    if (el) el.style.display = t === tab ? 'block' : 'none';
  });
  document.querySelectorAll('#server-tabs .auth-tab').forEach(function(btn, i) {
    btn.classList.toggle('active', ['general','members','channels'][i] === tab);
  });
  if (tab === 'members') loadMembersList();
  if (tab === 'channels') loadChannelPerms();
}

function saveServerSettings() {
  var data = {
    name: document.getElementById('server-name').value.trim() || 'TeamChat',
    icon: document.getElementById('server-icon').value.trim() || '💬',
    description: document.getElementById('server-desc').value.trim(),
    rules: document.getElementById('server-rules').value.trim(),
    message_retention_days: parseInt(document.getElementById('server-retention').value) || 0
  };
  sb.from('server_settings').update(data).eq('id', 1).then(function(r) {
    if (r.error) { showToast('❌ ' + r.error.message); return; }
    serverSettings = Object.assign(serverSettings, data);
    applyServerSettings();
    closeModal('server-modal');
    showToast('✅ サーバー設定を保存しました');
    // Apply retention if set
    if (data.message_retention_days > 0) applyMessageRetention(data.message_retention_days);
  });
}

function applyMessageRetention(days) {
  var cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - days);
  sb.from('messages').delete().lt('created_at', cutoff.toISOString()).then(function(r) {
    if (!r.error) showToast('🗑 ' + days + '日以上前のメッセージを削除しました');
  });
}

function showRules() {
  var titleEl = document.getElementById('rules-modal-title');
  var contentEl = document.getElementById('rules-modal-content');
  var text = '';
  if (serverSettings.description) text += '📖 説明
' + serverSettings.description + '

';
  if (serverSettings.rules) text += '📋 ルール
' + serverSettings.rules;
  if (!text) text = 'サーバーの説明・ルールは設定されていません。';
  titleEl.textContent = (serverSettings.icon || '💬') + ' ' + (serverSettings.name || 'TeamChat');
  contentEl.textContent = text;
  openModal('rules-modal');
}

// ===== MEMBER MANAGEMENT =====
function loadMembersList() {
  var el = document.getElementById('members-list');
  if (!el) return;
  el.innerHTML = '<div style="text-align:center;padding:20px;color:#8b93b0">読み込み中...</div>';
  
  sb.from('banned_users').select('user_id').then(function(banRes) {
    var bannedIds = (banRes.data || []).map(function(b) { return b.user_id; });
    
    sb.from('profiles').select('*').order('username').then(function(r) {
      if (r.error) { el.innerHTML = '<div style="color:#e05a5a">エラー</div>'; return; }
      el.innerHTML = '';
      var profiles = r.data || [];
      
      profiles.forEach(function(p) {
        var isSelf = p.id === currentUser.id;
        var isBanned = bannedIds.indexOf(p.id) !== -1;
        var color = p.display_color || '#5b8af0';
        
        var div = document.createElement('div');
        div.className = 'member-item';
        div.id = 'member-' + p.id;
        
        var avatarEl = document.createElement('div');
        avatarEl.className = 'avatar';
        avatarEl.style.background = color;
        avatarEl.style.width = '32px';
        avatarEl.style.height = '32px';
        avatarEl.style.fontSize = '13px';
        avatarEl.style.flexShrink = '0';
        avatarEl.textContent = (p.username || '?')[0].toUpperCase();
        
        var infoEl = document.createElement('div');
        infoEl.className = 'member-info';
        var nameEl = document.createElement('div');
        nameEl.className = 'member-name';
        nameEl.textContent = p.username || p.id.slice(0,8);
        var roleEl = document.createElement('div');
        roleEl.className = 'member-role';
        roleEl.textContent = isBanned ? '🚫 BAN済み' : (p.is_admin ? '👑 管理者' : '👤 メンバー');
        infoEl.appendChild(nameEl);
        infoEl.appendChild(roleEl);
        
        var actionsEl = document.createElement('div');
        actionsEl.className = 'member-actions';
        
        if (!isSelf) {
          if (!isBanned) {
            // Admin toggle
            var adminBtn = document.createElement('button');
            adminBtn.className = 'member-btn admin';
            adminBtn.textContent = p.is_admin ? '管理者解除' : '管理者';
            (function(profile, btn) {
              btn.addEventListener('click', function() { toggleAdmin(profile, btn); });
            })(p, adminBtn);
            actionsEl.appendChild(adminBtn);

            // Kick
            var kickBtn = document.createElement('button');
            kickBtn.className = 'member-btn kick';
            kickBtn.textContent = 'キック';
            (function(pid) {
              kickBtn.addEventListener('click', function() { kickUser(pid); });
            })(p.id);
            actionsEl.appendChild(kickBtn);

            // Ban
            var banBtn = document.createElement('button');
            banBtn.className = 'member-btn ban';
            banBtn.textContent = 'BAN';
            (function(pid, pname) {
              banBtn.addEventListener('click', function() { banUser(pid, pname); });
            })(p.id, p.username);
            actionsEl.appendChild(banBtn);
          } else {
            // Unban
            var unbanBtn = document.createElement('button');
            unbanBtn.className = 'member-btn unban';
            unbanBtn.textContent = 'BAN解除';
            (function(pid) {
              unbanBtn.addEventListener('click', function() { unbanUser(pid); });
            })(p.id);
            actionsEl.appendChild(unbanBtn);
          }
        }
        
        div.appendChild(avatarEl);
        div.appendChild(infoEl);
        div.appendChild(actionsEl);
        el.appendChild(div);
      });
    });
  });
}

function toggleAdmin(profile, btn) {
  var newVal = !profile.is_admin;
  sb.from('profiles').update({ is_admin: newVal }).eq('id', profile.id).then(function(r) {
    if (r.error) { showToast('❌ ' + r.error.message); return; }
    profile.is_admin = newVal;
    btn.textContent = newVal ? '管理者解除' : '管理者';
    var roleEl = document.getElementById('member-' + profile.id);
    if (roleEl) {
      var role = roleEl.querySelector('.member-role');
      if (role) role.textContent = newVal ? '👑 管理者' : '👤 メンバー';
    }
    showToast(newVal ? '👑 管理者に設定しました' : '管理者を解除しました');
    loadAllProfiles();
  });
}

function kickUser(userId) {
  if (!confirm('このユーザーをキックしますか？（再ログイン可能）')) return;
  // キックはセッション削除が必要だがフロントでは不可のため、メッセージで通知
  showToast('⚠️ キック機能はサーバー側の設定が必要です。メンバーにログアウトを依頼してください。');
}

function banUser(userId, username) {
  if (!confirm('「' + username + '」をBANしますか？')) return;
  sb.from('banned_users').insert({ user_id: userId, banned_by: currentUser.id }).then(function(r) {
    if (r.error) { showToast('❌ ' + r.error.message); return; }
    showToast('🚫 BANしました');
    loadMembersList();
  });
}

function unbanUser(userId) {
  sb.from('banned_users').delete().eq('user_id', userId).then(function(r) {
    if (r.error) { showToast('❌ ' + r.error.message); return; }
    showToast('✅ BAN解除しました');
    loadMembersList();
  });
}

// ===== CHANNEL PERMISSIONS =====
function loadChannelPerms() {
  var el = document.getElementById('channel-perms-list');
  if (!el) return;
  el.innerHTML = '';
  
  rooms.forEach(function(room) {
    var div = document.createElement('div');
    div.className = 'perm-item';
    
    var nameEl = document.createElement('div');
    nameEl.className = 'perm-name';
    nameEl.innerHTML = '# ' + esc(room.name) + (room.is_readonly ? ' <span class="readonly-badge">読み取り専用</span>' : '');
    
    var label = document.createElement('label');
    label.className = 'toggle-switch';
    label.title = '読み取り専用';
    
    var input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = room.is_readonly || false;
    
    var slider = document.createElement('span');
    slider.className = 'toggle-slider';
    
    (function(r, inp, nameDiv) {
      inp.addEventListener('change', function() {
        sb.from('rooms').update({ is_readonly: inp.checked }).eq('id', r.id).then(function(res) {
          if (res.error) { showToast('❌ ' + res.error.message); inp.checked = !inp.checked; return; }
          r.is_readonly = inp.checked;
          // Update room in array
          for (var i = 0; i < rooms.length; i++) {
            if (rooms[i].id === r.id) { rooms[i].is_readonly = inp.checked; break; }
          }
          nameDiv.innerHTML = '# ' + esc(r.name) + (inp.checked ? ' <span class="readonly-badge">読み取り専用</span>' : '');
          // Update input area if current room
          if (currentRoom && currentRoom.id === r.id) {
            currentRoom.is_readonly = inp.checked;
            updateInputAreaForRoom();
          }
          showToast(inp.checked ? '🔒 読み取り専用にしました' : '🔓 編集可能にしました');
        });
      });
    })(room, input, nameEl);
    
    label.appendChild(input);
    label.appendChild(slider);
    div.appendChild(nameEl);
    div.appendChild(label);
    el.appendChild(div);
  });
}

function updateInputAreaForRoom() {
  var inputArea = document.getElementById('input-area');
  if (!inputArea) return;
  if (currentRoom && currentRoom.is_readonly && !isAdmin) {
    inputArea.innerHTML = '<div style="text-align:center;padding:12px;color:#8b93b0;font-size:13px">🔒 このチャンネルは読み取り専用です</div>';
  } else {
    // Restore input area if it was replaced - reload the page section
    if (!inputArea.querySelector('.msg-input')) {
      selectRoom(currentRoom);
    }
  }
}
